<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой первый сайт</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      text-align: center;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 55px;
      margin-bottom: 15px;
    }

    p {
      font-size: 22px;
      color: #c7cbd6;
    }

    .button {
      margin-top: 25px;
      padding: 15px 30px;
      background: white;
      color: #0b1020;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <section class="hero">
    <h1>Мой первый сайт</h1>
    <p>Этот сайт создан вместе с искусственным интеллектом.</p>
    <a class="button" href="#">Начать</a>
  </section>

</body>
</html>
